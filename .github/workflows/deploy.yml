name: CI/CD

# main 에 push 되면: 테스트 → (통과 시) 이미지 빌드·ECR push → EC2 자동 배포
on:
  push:
    branches: [ main ]

# OIDC로 AWS 역할을 상속받기 위해 id-token 쓰기 권한 필요
permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-northeast-2
  ECR_REPOSITORY: routine-server

jobs:
  # ── 1) 테스트 게이트 (통과해야 배포로 진행) ──
  test:
    runs-on: ubuntu-latest
    # @SpringBootTest 가 DB(Flyway)를 띄우므로 Postgres 서비스 컨테이너를 함께 기동
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: routine_calendar
          POSTGRES_USER: routine
          POSTGRES_PASSWORD: routine
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U routine -d routine_calendar"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Run tests
        working-directory: server
        env:
          DB_URL: jdbc:postgresql://localhost:5432/routine_calendar
          DB_USERNAME: routine
          DB_PASSWORD: routine
        run: |
          chmod +x gradlew
          ./gradlew test --no-daemon

  # ── 2) 빌드·ECR push·EC2 배포 (test 성공 후에만) ──
  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        working-directory: server
        run: |
          IMAGE=${{ secrets.ECR_REGISTRY }}/${ECR_REPOSITORY}
          docker build -t "$IMAGE:latest" -t "$IMAGE:${{ github.sha }}" .
          docker push "$IMAGE:latest"
          docker push "$IMAGE:${{ github.sha }}"

      - name: Deploy to EC2 over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            cd ~/routine-calendar
            git pull --ff-only
            cd server
            aws ecr get-login-password --region ap-northeast-2 \
              | docker login --username AWS --password-stdin ${{ secrets.ECR_REGISTRY }}
            export SERVER_IMAGE=${{ secrets.ECR_REGISTRY }}/routine-server:${{ github.sha }}
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d
            docker image prune -f
