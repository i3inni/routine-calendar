# 운영용 compose (EC2에서 사용).
#   배포:  docker compose -f docker-compose.prod.yml pull && docker compose -f docker-compose.prod.yml up -d
#
# 개발용 docker-compose.yml 과의 차이:
#   - 비밀번호/시크릿을 하드코딩하지 않고 .env 에서 주입받는다 (커밋 금지).
#   - DEV_LOGIN_ENABLED 는 기본 false (개발용 무인증 로그인 차단).
#   - postgres 포트를 호스트로 노출하지 않는다 (컨테이너 네트워크 안에서만 접근).
#   - server 는 EC2에서 빌드하지 않고 ECR에서 이미지를 pull 한다 (CI가 빌드·push).

services:
  postgres:
    image: postgres:16
    container_name: routine-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-routine_calendar}
      POSTGRES_USER: ${DB_USERNAME:-routine}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD 를 .env 에 설정하세요}
    volumes:
      - routine-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-routine} -d ${DB_NAME:-routine_calendar}"]
      interval: 5s
      timeout: 3s
      retries: 10

  server:
    # ECR 이미지. CI(GitHub Actions)가 빌드해 push 한 것을 pull 한다.
    # 이미지 주소(계정ID 포함)는 저장소에 박지 않는다 → SERVER_IMAGE 로 주입.
    #   - 수동 실행: EC2의 .env 에 SERVER_IMAGE=<ECR URI>:latest
    #   - CI 배포: 워크플로가 특정 태그(커밋 SHA)로 SERVER_IMAGE 를 넘김
    image: ${SERVER_IMAGE:?SERVER_IMAGE 를 .env 또는 배포 환경에서 지정하세요 (예: <acct>.dkr.ecr.ap-northeast-2.amazonaws.com/routine-server:latest)}
    container_name: routine-server
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      # 컨테이너 네트워크 안에서 DB 호스트는 서비스명(postgres)이다.
      # .env 의 DB_URL(로컬용 localhost) 을 여기서 덮어써 컨테이너용으로 고정한다.
      DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-routine_calendar}
      DEV_LOGIN_ENABLED: "false"
    ports:
      # 호스트의 127.0.0.1(루프백)에만 바인딩 → 외부에서 8080 직접 접근 불가.
      # 앞단 Nginx(호스트)만 127.0.0.1:8080 으로 프록시한다.
      - "127.0.0.1:8080:8080"

volumes:
  routine-pgdata:
